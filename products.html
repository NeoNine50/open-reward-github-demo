<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Open Reward - Products</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background-color: #fcfcfc; color: #222; text-align: center; }
        
        .top-bar { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 1000; }
        .top-bar-container { max-width: 1100px; width: 100%; height: 100%; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; position: relative; padding: 0 16px; box-sizing: border-box; }
        
        .brand-title { font-size: 20px; font-weight: bold; color: #222; text-decoration: none; line-height: 1; }
        
        .nav-item-dropdown-wrapper { position: relative; display: inline-block; }
        .menu-btn { background: none; border: none; font-size: 28px; color: #000000; cursor: pointer; padding: 4px; line-height: 1; display: block; }
        .dropdown-nav { display: none; flex-direction: column; gap: 12px; background: #ffffff; border: 1px solid #ccc; border-radius: 8px; padding: 16px; position: absolute; right: 0; top: 100%; margin-top: 8px; width: 220px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); z-index: 1001; text-align: left; box-sizing: border-box; }
        .dropdown-nav.open { display: flex; }
        .dropdown-nav a { text-decoration: none; color: #000000; font-weight: 600; font-size: 16px; }
        
        .main-content { max-width: 900px; margin: 90px auto 0 auto; padding: 16px; transition: opacity 0.3s ease; }
        .table-controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; margin-bottom: 12px; }
        .search-box input, select, button { padding: 6px 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 auto 16px auto; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; background: #fff; margin: 0 auto; }
        table, th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: center; }
        th { background: #f0f0f0; cursor: pointer; }
        .table-pagination { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin-top: 12px; }

        .op-actions { display: flex; flex-direction: column; gap: 4px; align-items: center; }
        .op-actions button { width: 100%; max-width: 120px; }

        /* Loader Overlay */
        #loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.7); display: none;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .spinner {
            width: 48px; height: 48px; border: 5px solid #ccc;
            border-top: 5px solid #000; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader-overlay"><div class="spinner"></div></div>

<header class="top-bar">
    <div class="top-bar-container">
        <a href="index.html" class="brand-title">Open Reward</a>
        <div class="nav-item-dropdown-wrapper">
            <button class="menu-btn" onclick="toggleNav(event)" aria-label="Toggle menu">&#9776;</button>
            <nav id="navMenu" class="dropdown-nav">
                <a href="users.html">Show users</a>
                <a href="products.html"><b>Show products</b></a>
                <a href="classes.html">Show classes</a>
                <a href="transfers.html">Show transactions</a>
                <a href="adduser.html">Add user</a>
                <a href="product.html">Add product</a>
                <a href="addclass.html">Add class</a>
                <a href="transfer.html">Create transaction</a>
            </nav>
        </div>
    </div>
</header>

<div class="main-content">
    <h3 id="table-heading">Showing all products</h3>

    <div class="table-controls">
        <div class="table-info">
            <label for="entries">Show</label>
            <select id="entries" onchange="updateTable()">
                <option value="10">10</option>
                <option value="25" selected>25</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
            <span>entries</span>
        </div>
        <div class="search-box">
            <input type="text" id="search" placeholder="Search..." onkeyup="searchTable()">
        </div>
    </div>

    <div class="table-container">
        <table id="product-table">
            <thead>
            <tr id="table-header-row"></tr>
            </thead>
            <tbody id="product-tbody"></tbody>
        </table>
    </div>

    <div class="table-pagination">
        <span id="table-info"></span>
        <button onclick="prevPage()">Previous</button>
        <span id="page-numbers"></span>
        <button onclick="nextPage()">Next</button>
    </div>
</div>

<script src="store.js"></script>
<script>
    function showLoading() {
        document.getElementById('loader-overlay').style.display = 'flex';
        document.querySelector('.main-content').style.opacity = '0.3';
    }

    document.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', function(e) {
            if (this.href && !this.href.startsWith('javascript') && this.target !== '_blank') {
                showLoading();
            }
        });
    });

    function toggleNav(e) { 
        if (e) e.stopPropagation();
        document.getElementById('navMenu').classList.toggle('open'); 
    }

    document.addEventListener('click', function(e) {
        const wrapper = document.querySelector('.nav-item-dropdown-wrapper');
        const navMenu = document.getElementById('navMenu');
        if (wrapper && !wrapper.contains(e.target)) {
            navMenu.classList.remove('open');
        }
    });

    let currentPage = 1;
    let entriesPerPage = 25;
    let sortDirection = true;

    const urlParams = new URLSearchParams(window.location.search);
    const productIdFilter = urlParams.get('producers_of');

    function renderTable() {
        const products = DB.get('products');
        const userProducts = DB.get('user_products');
        const users = DB.get('users');
        const tbody = document.getElementById("product-tbody");
        const headerRow = document.getElementById("table-header-row");

        if (productIdFilter) {
            const currentProd = products.find(p => p.id === parseInt(productIdFilter));
            const prodName = currentProd ? currentProd.name : 'Unknown';

            document.getElementById("table-heading").innerText = `Producers of Product #${productIdFilter} (${prodName})`;
            headerRow.innerHTML = `
                <th onclick="sortTable(0)">ID <span class="sort-arrow" id="sort-arrow-0">▲▼</span></th>
                <th onclick="sortTable(1)">Name <span class="sort-arrow" id="sort-arrow-1">▲▼</span></th>
                <th onclick="sortTable(2)">Gateway <span class="sort-arrow" id="sort-arrow-2">▲▼</span></th>
                <th onclick="sortTable(3)">Benefit <span class="sort-arrow" id="sort-arrow-3">▲▼</span></th>
                <th onclick="sortTable(4)">Created <span class="sort-arrow" id="sort-arrow-4">▲▼</span></th>
                <th>Operation</th>
            `;

            const filteredUP = userProducts.filter(up => up.ProductID === parseInt(productIdFilter));
            tbody.innerHTML = filteredUP.map(up => {
                const u = users.find(usr => usr.id === up.UserID) || { name: 'Unknown' };
                return `<tr>
                    <td>${u.id}</td>
                    <td>${u.name}</td>
                    <td>${up.gateway}</td>
                    <td>${up.benefit}</td>
                    <td>${up.time_created}</td>
                    <td>
                        <div class="op-actions">
                            <button onclick="editProductForUser(${up.UserID}, ${up.ProductID})">Edit Product</button>
                            <button onclick="editProducerValues(${up.UserID}, ${up.ProductID})">Edit Values</button>
                            <button onclick="deleteProducerAssignment(${up.UserID}, ${up.ProductID})">Delete</button>
                        </div>
                    </td>
                </tr>`;
            }).join('');
        } else {
            headerRow.innerHTML = `
                <th onclick="sortTable(0)">ID <span class="sort-arrow" id="sort-arrow-0">▲▼</span></th>
                <th onclick="sortTable(1)">Name <span class="sort-arrow" id="sort-arrow-1">▲▼</span></th>
                <th onclick="sortTable(2)">Created <span class="sort-arrow" id="sort-arrow-2">▲▼</span></th>
                <th>Operation</th>
            `;
            tbody.innerHTML = products.map(p => `<tr>
                <td>${p.id}</td>
                <td>${p.name}</td>
                <td>${p.time_created}</td>
                <td>
                    <div class="op-actions">
                        <button onclick="showLoading(); window.location.href='products.html?producers_of=${p.id}';">Producers</button>
                        <button onclick="editProduct(${p.id})">Edit name</button>
                        <button onclick="deleteProduct(${p.id})">Delete</button>
                    </div>
                </td>
            </tr>`).join('');
        }
        displayTable();
    }

    function editProduct(productId) {
        let products = DB.get('products');
        const prod = products.find(p => p.id === productId);
        if (!prod) return;

        const newName = prompt("Enter new product name:", prod.name);
        if (newName === null) return;
        const trimmed = newName.trim();
        if (!trimmed) return alert("Product name cannot be empty.");

        const exists = products.some(p => p.id !== productId && p.name.toLowerCase() === trimmed.toLowerCase());
        if (exists) return alert("A product with this name already exists.");

        prod.name = trimmed;
        DB.set('products', products);
        renderTable();
    }

    function editProductForUser(userId, productId) {
        showLoading();
        window.location.href = `edituserproduct.html?user_id=${userId}&product_id=${productId}`;
    }

    function editProducerValues(userId, productId) {
        showLoading();
        window.location.href = `adduserproduct.html?user_id=${userId}&product_id=${productId}`;
    }

    function deleteProduct(productId) {
        if (!confirm("Are you sure you want to delete this product?")) return;

        let products = DB.get('products');
        let userProducts = DB.get('user_products');

        products = products.filter(p => p.id !== productId);
        userProducts = userProducts.filter(up => up.ProductID !== productId);

        DB.set('products', products);
        DB.set('user_products', userProducts);
        alert('Product deleted successfully!');
        renderTable();
    }

    function deleteProducerAssignment(userId, productId) {
        if (!confirm("Are you sure you want to remove this producer and their assigned values for this product?")) return;

        let userProducts = DB.get('user_products');
        userProducts = userProducts.filter(up => !(up.UserID === userId && up.ProductID === productId));

        DB.set('user_products', userProducts);
        alert('Producer assignment removed successfully!');
        renderTable();
    }

    function updateTable() { entriesPerPage = parseInt(document.getElementById("entries").value); currentPage = 1; displayTable(); }
    function searchTable() { currentPage = 1; displayTable(); }

    function displayTable() {
        const table = document.getElementById("product-table");
        const rows = Array.from(table.querySelector("tbody").querySelectorAll("tr"));
        const searchText = document.getElementById("search").value.toLowerCase();
        const filteredRows = rows.filter(row => row.innerText.toLowerCase().includes(searchText));

        const totalEntries = filteredRows.length;
        const start = (currentPage - 1) * entriesPerPage;
        const end = start + entriesPerPage;

        rows.forEach(row => row.style.display = "none");
        filteredRows.slice(start, end).forEach(row => row.style.display = "");

        document.getElementById("table-info").innerText = `Showing ${Math.min(start + 1, totalEntries)} to ${Math.min(end, totalEntries)} of ${totalEntries} entries`;
    }

    function nextPage() { currentPage++; displayTable(); }
    function prevPage() { currentPage = Math.max(1, currentPage - 1); displayTable(); }

    function sortTable(n) {
        const table = document.getElementById("product-table");
        let rows = Array.from(table.querySelector("tbody").rows);
        rows.sort((a, b) => {
            let x = a.cells[n].innerText.toLowerCase();
            let y = b.cells[n].innerText.toLowerCase();
            return sortDirection ? x.localeCompare(y) : y.localeCompare(x);
        });
        sortDirection = !sortDirection;
        rows.forEach(row => table.querySelector("tbody").appendChild(row));
        displayTable();
    }

    renderTable();
</script>
</body>
</html>
