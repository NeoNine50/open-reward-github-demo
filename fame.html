<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width"/>
    <title>Open Reward - Hall of Fame</title>
    <style>
    table, th, td { border: 1px solid black; border-collapse: collapse; padding: 1px 10px; }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr><th colspan="5">Hall of Fame</th></tr>
            <tr>
                <th>Prestige</th>
                <th>ID</th>
                <th>Name</th>
                <th>NBR</th>
                <th>Created</th>
            </tr>
        </thead>
        <tbody id="fame-tbody"></tbody>
    </table>

    <script src="store.js"></script>
    <script>
        const users = DB.get('users').filter(u => u.id !== 0);
        users.sort((a, b) => b.fame - a.fame);

        document.getElementById('fame-tbody').innerHTML = users.map(u => `
            <tr>
                <td style="overflow: hidden; max-width: 66px;">${u.fame}</td>
                <td>${u.id}</td>
                <td>${u.name}</td>
                <td style="overflow: hidden; max-width: 66px;">${u.nbr}</td>
                <td>${u.time_created}</td>
            </tr>
        `).join('');
    </script>
</body>
</html>
