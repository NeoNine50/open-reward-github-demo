<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Open Reward - Hall of Fame</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background-color: #fcfcfc; color: #222; text-align: center; }
        
        .top-bar { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 1000; }
        .top-bar-container { max-width: 1100px; width: 100%; height: 100%; margin: 0 auto; display: flex; align-items: center; justify-content: flex-start; position: relative; padding: 0 16px; box-sizing: border-box; }
        
        .brand-title { font-size: 20px; font-weight: bold; color: #222; text-decoration: none; line-height: 1; }
        
        .main-content { max-width: 600px; margin: 90px auto 0 auto; padding: 16px; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; min-width: 400px; background: #fff; margin: 0 auto; }
        table, th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: center; }
        th { background: #f0f0f0; }
    </style>
</head>
<body>
<header class="top-bar">
    <div class="top-bar-container">
        <a href="index.html" class="brand-title">Open Reward</a>
    </div>
</header>

<div class="main-content">
    <div class="table-container">
        <table>
            <thead>
                <tr><th colspan="5" style="font-size: 1.2em;">Hall of Fame</th></tr>
                <tr>
                    <th>Prestige</th>
                    <th>ID</th>
                    <th>Name</th>
                    <th>NBR</th>
                    <th>Created</th>
                </tr>
            </thead>
            <tbody id="fame-tbody"></tbody>
        </table>
    </div>
</div>

<script src="store.js"></script>
<script>
    const users = DB.get('users').filter(u => u.id !== 0);
    users.sort((a, b) => b.fame - a.fame);

    document.getElementById('fame-tbody').innerHTML = users.map(u => `
        <tr>
            <td>${u.fame}</td>
            <td>${u.id}</td>
            <td>${u.name}</td>
            <td>${u.nbr}</td>
            <td>${u.time_created}</td>
        </tr>
    `).join('');
</script>
</body>
</html>
