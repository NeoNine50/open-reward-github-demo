<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width"/>
    <title>Open Reward - Transactions</title>
    <style>
    table, th, td {
        border: 1px solid black;
        border-collapse: collapse;
        padding: 1px 10px;
    }
    .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
    }
    </style>
</head>
<body>
<h1>Open Reward admin</h1>
<p>
    <a href="users.html">Show users</a> &middot;
    <a href="products.html">Show products</a> &middot;
    <b><a href="transfers.html">Show transactions</a></b>
    <br>
    <a href="adduser.html">Add user</a> &middot;
    <a href="product.html">Add product</a> &middot;
    <a href="transfer.html">Create transaction</a>
</p>
<div class="table-controls">
    <div class="table-info">
        <label for="entries">Show</label>
        <select id="entries" onchange="updateTable()">
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="100">100</option>
        </select>
        <span>entries</span>
    </div>
    <div class="search-box">
        <input type="text" size="29" id="search" placeholder="Search..." onkeyup="searchTable()">
    </div>
</div>

<table id="data-table">
    <thead>
    <tr>
        <th onclick="sortTable(0)">ID <span class="sort-indicator" id="sort-indicator-0">▲▼</span></th>
        <th onclick="sortTable(1)">Producer <span class="sort-indicator" id="sort-indicator-1">▲▼</span></th>
        <th onclick="sortTable(2)">Consumer <span class="sort-indicator" id="sort-indicator-2">▲▼</span></th>
        <th onclick="sortTable(3)">Product <span class="sort-indicator" id="sort-indicator-3">▲▼</span></th>
        <th onclick="sortTable(4)">Amount <span class="sort-indicator" id="sort-indicator-4">▲▼</span></th>
        <th onclick="sortTable(5)">NBR awarded <span class="sort-indicator" id="sort-indicator-5">▲▼</span></th>
        <th onclick="sortTable(6)">NBR removed <span class="sort-indicator" id="sort-indicator-6">▲▼</span></th>
        <th onclick="sortTable(7)">Created <span class="sort-indicator" id="sort-indicator-7">▲▼</span></th>
        <th>Note</th>
        <th>Operation</th>
    </tr>
    </thead>
    <tbody id="transfer-tbody"></tbody>
</table>

<div class="table-pagination">
    <span id="table-info"></span>
    <button onclick="prevPage()">Previous</button>
    <span id="page-numbers"></span>
    <button onclick="nextPage()">Next</button>
</div>

<script src="store.js"></script>
<script>
    let currentPage = 1;
    let entriesPerPage = 10;
    let sortDirection = Array(8).fill(true);
    const maxPageButtons = 10;

    function renderTransfers() {
        const transfers = DB.get('transfers');
        const users = DB.get('users');
        const products = DB.get('products');
        const tbody = document.getElementById('transfer-tbody');

        tbody.innerHTML = transfers.map(t => {
            const p = users.find(u => u.id === t.ProducerID) || { name: 'Unknown' };
            const c = users.find(u => u.id === t.ConsumerID) || { name: 'nobody/everybody' };
            const prod = products.find(pr => pr.id === t.ProductID) || { name: 'Unknown' };

            return `<tr>
                <td>${t.id}</td>
                <td>${p.name}</td>
                <td>${c.name}</td>
                <td>${prod.name}</td>
                <td>${t.amount}</td>
                <td style="overflow: hidden; max-width: 66px;">${t.nbr}</td>
                <td style="overflow: hidden; max-width: 66px;">${t.gnbr}</td>
                <td>${t.time_created}</td>
                <td>
                    <form onsubmit="updateComment(event, ${t.id})" style="margin-top: 8px;">
                        <label for="comment-${t.id}" class="visually-hidden">Edit note</label>
                        <textarea id="comment-${t.id}" name="updated_comment" rows="2" style="width:100%;" oninput="autoExpand(this)">${t.comment || ''}</textarea>
                        <button type="submit">Save edit</button>
                    </form>
                </td>
                <td>
                    <button onclick="deleteTransfer(${t.id})">Delete record</button>
                </td>
            </tr>`;
        }).join('');

        document.querySelectorAll('textarea').forEach(textarea => autoExpand(textarea));
        displayTable();
    }

    function updateComment(e, id) {
        e.preventDefault();
        const transfers = DB.get('transfers');
        const item = transfers.find(t => t.id === id);
        if (item) {
            item.comment = document.getElementById(`comment-${id}`).value;
            DB.set('transfers', transfers);
            alert('Note updated successfully.');
        }
    }

    function deleteTransfer(id) {
        if (!confirm("Are you sure you want to delete this record?")) return;

        let transfers = DB.get('transfers');
        const users = DB.get('users');
        const t = transfers.find(x => x.id === id);

        if (t) {
            // Revert balances matching Rust route logic: MAX(0.0, balance - NBR)
            const producer = users.find(u => u.id === t.ProducerID);
            if (producer) {
                producer.nbr = Math.max(0.0, producer.nbr - t.nbr);
                producer.fame = Math.max(0.0, producer.fame - t.nbr);
            }
            const consumer = users.find(u => u.id === t.ConsumerID);
            if (consumer && t.ConsumerID !== 0) {
                consumer.nbr += t.gnbr;
            }

            transfers = transfers.filter(x => x.id !== id);
            DB.set('users', users);
            DB.set('transfers', transfers);
            renderTransfers();
        }
    }

    function updateTable() {
        entriesPerPage = parseInt(document.getElementById("entries").value);
        currentPage = 1;
        displayTable();
    }

    function searchTable() {
        currentPage = 1;
        displayTable();
    }

    function displayTable() {
        const table = document.getElementById("data-table");
        const tbody = table.querySelector("tbody");
        const rows = Array.from(tbody.querySelectorAll("tr"));
        const searchText = document.getElementById("search").value.toLowerCase();

        const filteredRows = rows.filter(row => row.innerText.toLowerCase().includes(searchText));
        const totalEntries = filteredRows.length;
        const totalPages = Math.ceil(totalEntries / entriesPerPage) || 1;
        const start = (currentPage - 1) * entriesPerPage;
        const end = start + entriesPerPage;

        rows.forEach(row => row.style.display = "none");
        filteredRows.slice(start, end).forEach(row => row.style.display = "");

        document.getElementById("table-info").innerText = `Showing ${Math.min(start + 1, totalEntries)} to ${Math.min(end, totalEntries)} of ${totalEntries} entries`;
        updatePageNumbers(totalPages);
    }

    function updatePageNumbers(totalPages) {
        const pageNumbers = document.getElementById("page-numbers");
        pageNumbers.innerHTML = "";

        const startPage = Math.max(1, currentPage - Math.floor(maxPageButtons / 2));
        const endPage = Math.min(totalPages, startPage + maxPageButtons - 1);

        for (let i = startPage; i <= endPage; i++) {
            const pageButton = document.createElement("button");
            pageButton.className = "pagination-button";
            if (i === currentPage) pageButton.classList.add("active");
            pageButton.innerText = i;
            pageButton.onclick = () => {
                currentPage = i;
                displayTable();
            };
            pageNumbers.appendChild(pageButton);
        }
    }

    function nextPage() { currentPage++; displayTable(); }
    function prevPage() { currentPage = Math.max(1, currentPage - 1); displayTable(); }

    function sortTable(n) {
        const table = document.getElementById("data-table");
        const tbody = table.querySelector("tbody");
        let rows = Array.from(tbody.querySelectorAll("tr"));
        const ascending = sortDirection[n];

        rows.sort((a, b) => {
            const x = a.cells[n].innerText;
            const y = b.cells[n].innerText;
            return ascending ? x.localeCompare(y) : y.localeCompare(x);
        });

        sortDirection[n] = !ascending;
        rows.forEach(row => tbody.appendChild(row));
        updateSortIndicators(n, ascending);
    }

    function updateSortIndicators(columnIndex, ascending) {
        const indicators = document.querySelectorAll(".sort-indicator");
        indicators.forEach((indicator, index) => {
            if (index === columnIndex) {
                indicator.innerText = ascending ? "▲" : "▼";
            } else {
                indicator.innerText = "▲▼";
            }
        });
    }

    function autoExpand(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = (textarea.scrollHeight) + 'px';
    }

    renderTransfers();
</script>
</body>
</html>
