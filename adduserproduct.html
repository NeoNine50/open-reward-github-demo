<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Open Reward - Configure User Product</title>
</head>
<body>
<h1>Open Reward admin</h1>
<p>
    <a href="users.html">Show users</a> &middot;
    <a href="products.html">Show products</a> &middot;
    <a href="transfers.html">Show transactions</a>
    <br>
    <a href="adduser.html">Add user</a> &middot;
    <b><a href="product.html">Add product</a></b> &middot;
    <a href="transfer.html">Create transaction</a>
</p>
<form id="productConfigForm">
    <table>
        <tr>
            <td><label for="gateway">gateway</label></td>
            <td></td><td><input type="number" id="gateway" min="0" step="0.000001" required autofocus /></td><td></td>
        </tr>
        <tr><td colspan="4"><hr></td></tr>
        <tr>
            <td><label for="resabundance">resource abundance</label></td>
            <td>0</td><td><input type="number" id="resabundance" min="0" step="0.01" value="1" required /></td><td>&infin;</td>
        </tr>
        <tr>
            <td><label for="beneficiaries">number of beneficiaries</label></td>
            <td>0</td><td><input type="number" id="beneficiaries" min="0" value="1" required /></td><td>&infin;</td>
        </tr>
        <tr>
            <td><label for="producers">number of producers</label></td>
            <td>0</td><td><input type="number" id="producers" min="0" value="1" required /></td><td>&infin;</td>
        </tr>
        <tr><td colspan="4"><hr></td></tr>
        <tr>
            <td><label for="conssubben">consumer subjective benefit</label></td>
            <td>-100%</td><td><input type="range" id="conssubben" min="-1" max="1" step="0.1" value="0" required /></td><td>100%</td>
        </tr>
        <tr>
            <td><label for="ccs">consumer subj. benefit tun.</label></td>
            <td>0</td><td><input type="number" id="ccs" min="0" step="0.000001" value="1" required /></td><td>&infin;</td>
        </tr>
        <tr>
            <td><label for="consobjben">consumer objective benefit</label></td>
            <td>-100%</td><td><input type="range" id="consobjben" min="-1" max="1" step="0.1" value="0" required /></td><td>100%</td>
        </tr>
        <tr>
            <td><label for="cco">consumer objective benefit tun.</label></td>
            <td>0</td><td><input type="number" id="cco" min="0" step="0.000001" value="1" required /></td><td>&infin;</td>
        </tr>
        <tr><td colspan="4"><hr></td></tr>
        <tr>
            <td><label for="envben">environmental benefit</label></td>
            <td>-100%</td><td><input type="range" id="envben" min="-1" max="1" step="0.1" value="0" required /></td><td>100%</td>
        </tr>
        <tr>
            <td><label for="ceb">environmental benefit tun.</label></td>
            <td>0</td><td><input type="number" id="ceb" min="0" step="0.000001" value="1" required /></td><td>&infin;</td>
        </tr>
        <tr>
            <td><label for="humanben">human benefit</label></td>
            <td>-100%</td><td><input type="range" id="humanben" min="-1" max="1" step="0.1" value="0" required /></td><td>100%</td>
        </tr>
        <tr>
            <td><label for="chb">human benefit tun.</label></td>
            <td>0</td><td><input type="number" id="chb" min="0" step="0.000001" value="1" required /></td><td>&infin;</td>
        </tr>
        <tr><td colspan="4"><hr></td></tr>
        <tr>
            <td colspan="2">Formula implemented locally via math specs.</td>
            <td><input type="submit" value="Submit" /></td>
            <td></td>
        </tr>
    </table>
</form>

<script src="store.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const userId = parseInt(urlParams.get('user_id'));
    const productId = parseInt(urlParams.get('product_id'));

    const userProducts = DB.get('user_products');
    const existing = userProducts.find(up => up.UserID === userId && up.ProductID === productId);

    if (existing) {
        ['gateway', 'resabundance', 'beneficiaries', 'producers', 'ccs', 'conssubben', 'cco', 'consobjben', 'ceb', 'envben', 'chb', 'humanben'].forEach(field => {
            if (document.getElementById(field)) document.getElementById(field).value = existing[field];
        });
    }

    document.getElementById('productConfigForm').onsubmit = function(e) {
        e.preventDefault();
        const gateway = parseFloat(document.getElementById('gateway').value);
        if (gateway < 0) return alert("Gateway must never be negative!");

        const resabundance = parseFloat(document.getElementById('resabundance').value);
        const beneficiaries = parseFloat(document.getElementById('beneficiaries').value);
        const producers = parseFloat(document.getElementById('producers').value);
        const ccs = parseFloat(document.getElementById('ccs').value);
        const conssubben = parseFloat(document.getElementById('conssubben').value);
        const cco = parseFloat(document.getElementById('cco').value);
        const consobjben = parseFloat(document.getElementById('consobjben').value);
        const ceb = parseFloat(document.getElementById('ceb').value);
        const envben = parseFloat(document.getElementById('envben').value);
        const chb = parseFloat(document.getElementById('chb').value);
        const humanben = parseFloat(document.getElementById('humanben').value);

        // Replicating Rust Rust Math Formula: ceil(resabundance * ln(1 + beneficiaries/producers) * sum_benefits) clamped at 0
        const rawBenefit = resabundance * Math.log(1.0 + (beneficiaries / producers)) * 
            ((ccs * conssubben) + (cco * consobjben) + (ceb * envben) + (chb * humanben));
        const benefit = Math.max(0, Math.ceil(rawBenefit));

        const newRecord = {
            ProductID: productId,
            UserID: userId,
            gateway,
            benefit,
            resabundance,
            beneficiaries,
            producers,
            ccs,
            conssubben,
            cco,
            consobjben,
            ceb,
            envben,
            chb,
            humanben,
            time_created: new Date().toLocaleString()
        };

        const idx = userProducts.findIndex(up => up.ProductID === productId && up.UserID === userId);
        if (idx !== -1) {
            userProducts[idx] = newRecord;
        } else {
            userProducts.push(newRecord);
        }

        DB.set('user_products', userProducts);
        window.location.href = "users.html";
    };
</script>
</body>
</html>
