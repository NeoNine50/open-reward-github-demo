<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Open Reward - Create Transaction</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background-color: #fcfcfc; color: #222; text-align: center; }
        
        .top-bar { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 1000; }
        .top-bar-container { max-width: 1100px; width: 100%; height: 100%; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; position: relative; padding: 0 16px; box-sizing: border-box; }
        
        .brand-title { font-size: 20px; font-weight: bold; color: #222; text-decoration: none; line-height: 1; }
        
        .nav-item-dropdown-wrapper { position: relative; display: inline-block; }
        .menu-btn { background: none; border: none; font-size: 28px; color: #000000; cursor: pointer; padding: 4px; line-height: 1; display: block; }
        .dropdown-nav { display: none; flex-direction: column; gap: 12px; background: #ffffff; border: 1px solid #ccc; border-radius: 8px; padding: 16px; position: absolute; right: 0; top: 100%; margin-top: 8px; width: 220px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); z-index: 1001; text-align: left; box-sizing: border-box; }
        .dropdown-nav.open { display: flex; }
        .dropdown-nav a { text-decoration: none; color: #000000; font-weight: 600; font-size: 16px; }
        
        .main-content { max-width: 600px; margin: 90px auto 0 auto; padding: 16px; transition: opacity 0.3s ease; }
        .form-grid { display: flex; flex-direction: column; gap: 14px; max-width: 450px; margin: 0 auto; background: #fff; padding: 20px; border: 1px solid #ccc; border-radius: 6px; text-align: left; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 14px; color: #222; }
        select, input[type="number"], textarea { padding: 8px 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; width: 100%; }
        textarea { resize: vertical; min-height: 70px; font-family: inherit; }

        /* Rating Landscape Layout */
        .rating-container { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 10px 14px; border: 1px solid #ddd; border-radius: 4px; }
        .rating-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .rating-item input[type="radio"] { cursor: pointer; margin: 0; width: auto; }
        .rating-item label { font-size: 20px; cursor: pointer; font-weight: normal; }

        /* Loader Overlay */
        #loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.7); display: none;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .spinner {
            width: 48px; height: 48px; border: 5px solid #ccc;
            border-top: 5px solid #000; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader-overlay"><div class="spinner"></div></div>

<header class="top-bar">
    <div class="top-bar-container">
        <a href="index.html" class="brand-title">Open Reward</a>
        <div class="nav-item-dropdown-wrapper">
            <button class="menu-btn" onclick="toggleNav(event)" aria-label="Toggle menu">&#9776;</button>
            <nav id="navMenu" class="dropdown-nav">
                <a href="users.html">Show users</a>
                <a href="products.html">Show products</a>
                <a href="classes.html">Show classes</a>
                <a href="transfers.html">Show transactions</a>
                <a href="adduser.html">Add user</a>
                <a href="product.html">Add product</a>
                <a href="addclass.html">Add class</a>
                <a href="transfer.html"><b>Create transaction</b></a>
            </nav>
        </div>
    </div>
</header>

<div class="main-content">
    <h3>Create a transaction</h3>
    
    <form id="transferForm" class="form-grid">
        <div class="field">
            <label for="producer">Producer:</label>
            <select id="producer" required></select>
        </div>
        <div class="field">
            <label for="consumer">Consumer:</label>
            <select id="consumer" required></select>
        </div>
        <div class="field">
            <label for="product">Product:</label>
            <select id="product" required></select>
        </div>
        <div class="field">
            <label for="amount">Quantity:</label>
            <input type="number" id="amount" value="1" min="1" required/>
        </div>

        <div class="field">
            <label>Consumer Satisfaction Rating:</label>
            <div class="rating-container">
                <div class="rating-item"><input type="radio" name="rating_val" id="r1" value="-1.0" required><label for="r1">😠</label></div>
                <div class="rating-item"><input type="radio" name="rating_val" id="r2" value="-0.5"><label for="r2">🙁</label></div>
                <div class="rating-item"><input type="radio" name="rating_val" id="r3" value="0.0" checked><label for="r3">😐</label></div>
                <div class="rating-item"><input type="radio" name="rating_val" id="r4" value="0.5"><label for="r4">🙂</label></div>
                <div class="rating-item"><input type="radio" name="rating_val" id="r5" value="1.0"><label for="r5">❤️</label></div>
            </div>
        </div>

        <div class="field">
            <label for="comment">Comment:</label>
            <textarea id="comment" placeholder="Provide any additional notes..."></textarea>
        </div>
        <input type="submit" value="Create transaction" style="cursor: pointer; font-weight: bold; padding: 10px;"/>
    </form>
</div>

<script src="store.js"></script>
<script>
    function showLoading() {
        document.getElementById('loader-overlay').style.display = 'flex';
        document.querySelector('.main-content').style.opacity = '0.3';
    }

    document.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', function(e) {
            if (this.href && !this.href.startsWith('javascript') && this.target !== '_blank') {
                showLoading();
            }
        });
    });

    function toggleNav(e) { 
        if (e) e.stopPropagation();
        document.getElementById('navMenu').classList.toggle('open'); 
    }

    document.addEventListener('click', function(e) {
        const wrapper = document.querySelector('.nav-item-dropdown-wrapper');
        const navMenu = document.getElementById('navMenu');
        if (wrapper && !wrapper.contains(e.target)) {
            navMenu.classList.remove('open');
        }
    });

    const users = DB.get('users');
    const products = DB.get('products');
    const userProducts = DB.get('user_products');

    const producerSelect = document.getElementById('producer');
    const consumerSelect = document.getElementById('consumer');
    const productSelect = document.getElementById('product');

    producerSelect.innerHTML = users.filter(u => u.id !== 0).map(u => `<option value="${u.id}">#${u.id} ${u.name} (${u.nbr})</option>`).join('');
    consumerSelect.innerHTML = `<option value="0">nobody/everybody</option>` + 
        users.filter(u => u.id !== 0).map(u => `<option value="${u.id}">#${u.id} ${u.name} (${u.nbr})</option>`).join('');
    
    productSelect.innerHTML = products.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

    document.getElementById('transferForm').onsubmit = function(e) {
        e.preventDefault();
        const producerId = parseInt(producerSelect.value);
        const consumerId = parseInt(consumerSelect.value);
        const productId = parseInt(productSelect.value);
        const amount = parseFloat(document.getElementById('amount').value);
        const comment = document.getElementById('comment').value.trim();

        if (producerId === consumerId) return alert("Consumer and producer must not be the same.");

        const up = userProducts.find(x => x.ProductID === productId && x.UserID === producerId);
        if (!up) return alert("Product must be assigned to the user first.");

        const consumer = users.find(u => u.id === consumerId);
        if (consumerId !== 0 && (consumer.nbr - (up.gateway * amount) < 0)) {
            return alert("Consumer has insufficient NBR.");
        }

        // Fetch selected satisfaction rating
        const ratingVal = parseFloat(document.querySelector('input[name="rating_val"]:checked').value);

        // Update consumer subjective benefit in user product configuration
        up.conssubben = ratingVal;

        // Recalculate Benefit with updated rating
        const resabundance = up.resabundance ?? 1;
        const beneficiaries = up.beneficiaries ?? 1;
        const producers = up.producers ?? 1;
        const ccs = up.ccs ?? 1;
        const cco = up.cco ?? 1;
        const consobjben = up.consobjben ?? 0;
        const ceb = up.ceb ?? 1;
        const envben = up.envben ?? 0;
        const chb = up.chb ?? 1;
        const humanben = up.humanben ?? 0;

        const rawBenefit = resabundance * Math.log(1.0 + (beneficiaries / producers)) * ((ccs * up.conssubben) + (cco * consobjben) + (ceb * envben) + (chb * humanben));
        up.benefit = Math.max(0, Math.ceil(rawBenefit));

        // Save updated user_products back to LocalStorage
        DB.set('user_products', userProducts);

        const awardedNBR = up.benefit * amount;
        const removedNBR = consumerId !== 0 ? up.gateway * amount : 0;

        const producer = users.find(u => u.id === producerId);
        producer.nbr += awardedNBR;
        producer.fame += awardedNBR;
        if (consumerId !== 0) consumer.nbr -= removedNBR;

        const transfers = DB.get('transfers');
        const maxId = transfers.reduce((max, t) => (t.id > max ? t.id : max), 0);
        const newId = maxId + 1;

        transfers.unshift({
            id: newId,
            ProducerID: producerId,
            ConsumerID: consumerId,
            ProductID: productId,
            amount,
            nbr: awardedNBR,
            gnbr: removedNBR,
            comment,
            time_created: new Date().toLocaleString()
        });

        DB.set('users', users);
        DB.set('transfers', transfers);
        alert('Transaction created successfully!');
        showLoading();
        window.location.href = "transfers.html";
    };
</script>
</body>
</html>
