<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Reward - Add Product</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background-color: #fcfcfc; color: #222; text-align: center; }
        
        .top-bar { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 1000; }
        .top-bar-container { max-width: 1100px; width: 100%; height: 100%; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; position: relative; padding: 0 16px; box-sizing: border-box; }
        
        .brand-title { font-size: 20px; font-weight: bold; color: #222; text-decoration: none; line-height: 1; }
        
        .nav-item-dropdown-wrapper { position: relative; display: inline-block; }
        .menu-btn { background: none; border: none; font-size: 28px; color: #000000; cursor: pointer; padding: 4px; line-height: 1; display: block; }
        .dropdown-nav { display: none; flex-direction: column; gap: 12px; background: #ffffff; border: 1px solid #ccc; border-radius: 8px; padding: 16px; position: absolute; right: 0; top: 100%; margin-top: 8px; width: 220px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); z-index: 1001; text-align: left; box-sizing: border-box; }
        .dropdown-nav.open { display: flex; }
        .dropdown-nav a { text-decoration: none; color: #000000; font-weight: 600; font-size: 16px; }
        
        .main-content { max-width: 600px; margin: 90px auto 0 auto; padding: 16px; transition: opacity 0.3s ease; }
        .form-group { margin: 20px auto; display: flex; flex-direction: column; gap: 6px; max-width: 400px; align-items: center; }
        input[type="text"], button, input[type="submit"] { padding: 8px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }

        /* Loader Overlay */
        #loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.7); display: none;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .spinner {
            width: 48px; height: 48px; border: 5px solid #ccc;
            border-top: 5px solid #000; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader-overlay"><div class="spinner"></div></div>

<header class="top-bar">
    <div class="top-bar-container">
        <a href="index.html" class="brand-title">Open Reward</a>
        <div class="nav-item-dropdown-wrapper">
            <button class="menu-btn" onclick="toggleNav(event)" aria-label="Toggle menu">&#9776;</button>
            <nav id="navMenu" class="dropdown-nav">
                <a href="users.html">Show users</a>
                <a href="products.html">Show products</a>
                <a href="transfers.html">Show transactions</a>
                <a href="adduser.html">Add user</a>
                <a href="product.html"><b>Add product</b></a>
                <a href="transfer.html">Create transaction</a>
            </nav>
        </div>
    </div>
</header>

<div class="main-content">
    <h3>Register new product</h3>
    
    <form id="addProductForm">
        <div class="form-group">
            <label for="name"><b>Product Name:</b></label>
            <input type="text" id="name" required autofocus placeholder="Enter product name..."/>
        </div>
        <div style="max-width: 400px; margin: 0 auto;">
            <input type="submit" value="Submit" style="cursor: pointer; font-weight: bold;"/>
        </div>
    </form>
</div>

<script src="store.js"></script>
<script>
    function showLoading() {
        document.getElementById('loader-overlay').style.display = 'flex';
        document.querySelector('.main-content').style.opacity = '0.3';
    }

    document.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', function(e) {
            if (this.href && !this.href.startsWith('javascript') && this.target !== '_blank') {
                showLoading();
            }
        });
    });

    function toggleNav(e) { 
        if (e) e.stopPropagation();
        document.getElementById('navMenu').classList.toggle('open'); 
    }

    document.addEventListener('click', function(e) {
        const wrapper = document.querySelector('.nav-item-dropdown-wrapper');
        const navMenu = document.getElementById('navMenu');
        if (wrapper && !wrapper.contains(e.target)) {
            navMenu.classList.remove('open');
        }
    });

    document.getElementById('addProductForm').onsubmit = function(e) {
        e.preventDefault();
        const products = DB.get('products');
        const nameInput = document.getElementById('name').value.trim();

        const exists = products.some(p => p.name.toLowerCase() === nameInput.toLowerCase());
        if (exists) {
            alert("A product with this name already exists.");
            return;
        }

        const maxId = products.reduce((max, p) => (p.id > max ? p.id : max), 0);
        const newId = maxId + 1;

        products.push({
            id: newId,
            name: nameInput,
            gateway: 0,
            benefit: 0,
            time_created: new Date().toLocaleString()
        });

        DB.set('products', products);
        showLoading();
        window.location.href = 'products.html';
    };
</script>
</body>
</html>
