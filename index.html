<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Open Reward</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background-color: #fcfcfc; color: #222; text-align: center; }
        
        /* Fixed Outer Top Bar */
        .top-bar { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 1000; }
        
        /* Inner Container with Desktop Max-Width Limit */
        .top-bar-container { max-width: 1100px; width: 100%; height: 100%; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; position: relative; padding: 0 16px; box-sizing: border-box; }
        
        .brand-title { font-size: 20px; font-weight: bold; color: #222; text-decoration: none; line-height: 1; }
        
        /* Anchored Dropdown Menu Wrapper */
        .nav-item-dropdown-wrapper { position: relative; display: inline-block; }
        .menu-btn { background: none; border: none; font-size: 28px; color: #000000; cursor: pointer; padding: 4px; line-height: 1; display: block; }
        .dropdown-nav { display: none; flex-direction: column; gap: 12px; background: #ffffff; border: 1px solid #ccc; border-radius: 8px; padding: 16px; position: absolute; right: 0; top: 100%; margin-top: 8px; width: 220px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); z-index: 1001; text-align: left; box-sizing: border-box; }
        .dropdown-nav.open { display: flex; }
        .dropdown-nav a { text-decoration: none; color: #000000; font-weight: 600; font-size: 16px; }
        
        .main-content { max-width: 800px; margin: 90px auto 0 auto; padding: 16px; }
    </style>
</head>
<body>
<header class="top-bar">
    <div class="top-bar-container">
        <a href="index.html" class="brand-title">Open Reward</a>
        <div class="nav-item-dropdown-wrapper">
            <button class="menu-btn" onclick="toggleNav()" aria-label="Toggle menu">&#9776;</button>
            <nav id="navMenu" class="dropdown-nav">
                <a href="users.html">Show users</a>
                <a href="products.html">Show products</a>
                <a href="transfers.html">Show transactions</a>
                <a href="adduser.html">Add user</a>
                <a href="product.html">Add product</a>
                <a href="transfer.html">Create transaction</a>
            </nav>
        </div>
    </div>
</header>

<div class="main-content">
    <p>A custom build of the copiosis-rocket project running from a GitHub repository in your browser with client-side local storage</p>
    <p id="flash-message"></p>
</div>

<script src="store.js"></script>
<script>
    function toggleNav() { document.getElementById('navMenu').classList.toggle('open'); }
</script>
</body>
</html>
